services:
  postgres:
    image: postgres:16-alpine
    container_name: promobot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promobot}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-promobot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - promonet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promobot} -d ${POSTGRES_DB:-promobot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "128M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: promobot_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - promonet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.05"
          memory: "64M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promobot_migrator
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-promobot}:${POSTGRES_PASSWORD_ENC}@postgres:5432/${POSTGRES_DB:-promobot}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promonet
    secrets:
      - postgres_password
    restart: "no"

  api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: promobot_api
      restart: unless-stopped
      command: >
        sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
      env_file:
        - .env
      environment:
        - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-promobot}:${POSTGRES_PASSWORD_ENC}@postgres:5432/${POSTGRES_DB:-promobot}
        - REDIS_URL=redis://redis:6379/0
      depends_on:
        migrator:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - promonet
      secrets:
        - postgres_password
        - telegram_bot_token
        - telegram_api_hash
        - amazon_tag
        - mercadolivre_tag
        - shopee_app_id
        - shopee_tag
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s
      deploy:
        placement:
          constraints:
            - node.labels.zone == pessoal
        resources:
          limits:
            cpus: "1.0"
            memory: "1G"
          reservations:
            cpus: "0.25"
            memory: "256M"
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
  
  worker:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: promobot_worker
      restart: unless-stopped
      command: python -m app.workers.tasks
      env_file:
        - .env
      environment:
        - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-promobot}:${POSTGRES_PASSWORD_ENC}@postgres:5432/${POSTGRES_DB:-promobot}
        - REDIS_URL=redis://redis:6379/0
        - WORKER_MAX_ATTEMPTS=${WORKER_MAX_ATTEMPTS:-3}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      volumes:
        - media_cache:/app/media_cache
      networks:
        - promonet
      secrets:
        - postgres_password
        - telegram_bot_token
        - telegram_api_hash
        - amazon_tag
        - mercadolivre_tag
        - shopee_app_id
        - shopee_tag
      deploy:
        placement:
          constraints:
            - node.labels.zone == pessoal
        resources:
          limits:
            cpus: "0.5"
            memory: "512M"
          reservations:
            cpus: "0.1"
            memory: "128M"
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s

  telegram_listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promobot_telegram_listener
    restart: unless-stopped
    command: python -m app.adapters.telegram
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_cache:/app/media_cache
      - session_data:/app/sessions
    networks:
      - promonet
    secrets:
      - telegram_bot_token
      - telegram_api_hash
      - telegram_session_string
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.05"
          memory: "64M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: promobot_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - promonet
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          cpus: "0.05"
          memory: "32M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  promonet:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_cache:
  session_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_api_hash:
    file: ./secrets/telegram_api_hash.txt
  telegram_session_string:
    file: ./secrets/telegram_session_string.txt
  amazon_tag:
    file: ./secrets/amazon_tag.txt
  mercadolivre_tag:
    file: ./secrets/mercadolivre_tag.txt
  shopee_app_id:
    file: ./secrets/shopee_app_id.txt
  shopee_tag:
    file: ./secrets/shopee_tag.txt
