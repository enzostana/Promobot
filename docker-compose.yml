services:
  postgres:
    image: postgres:16-alpine
    container_name: ${INSTANCE_PREFIX:-promobot}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promobot}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-promobot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - promonet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promobot} -d ${POSTGRES_DB:-promobot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "128M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ${INSTANCE_PREFIX:-promobot}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - promonet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.05"
          memory: "64M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${INSTANCE_PREFIX:-promobot}-migrator
    container_name: ${INSTANCE_PREFIX:-promobot}_migrator
    command: alembic upgrade head
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-promobot}:${POSTGRES_PASSWORD_ENC}@postgres:5432/${POSTGRES_DB:-promobot}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - promonet
    secrets:
      - postgres_password
    restart: "no"

  api:
      build:
        context: .
        dockerfile: Dockerfile
      image: ${INSTANCE_PREFIX:-promobot}-api
      container_name: ${INSTANCE_PREFIX:-promobot}_api
      restart: unless-stopped
      command: >
        sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
      env_file:
        - ${ENV_FILE:-.env}
      environment:
        - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-promobot}:${POSTGRES_PASSWORD_ENC}@postgres:5432/${POSTGRES_DB:-promobot}
        - REDIS_URL=redis://redis:6379/0
        - SECRET_FILES_DIR=/app/secret_files
        - MERCADOLIVRE_SESSION_FILE=/run/secrets/mel_session
      volumes:
        - ${SECRETS_DIR_HOST:-/home/cinadmin/promobot/secrets}:/app/secret_files
        - media_cache:/app/media_cache
      depends_on:
        - migrator
        - postgres
        - redis
      networks:
        - promonet
      secrets:
        - postgres_password
        - telegram_bot_token
        - telegram_api_hash
        - amazon_tag
        - mercadolivre_tag
        - shopee_app_id
        - shopee_tag
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s
      deploy:
        placement:
          constraints:
            - node.labels.zone == pessoal
        resources:
          limits:
            cpus: "1.0"
            memory: "1G"
          reservations:
            cpus: "0.25"
            memory: "256M"
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
  
  worker:
      build:
        context: .
        dockerfile: Dockerfile
      image: ${INSTANCE_PREFIX:-promobot}-worker
      container_name: ${INSTANCE_PREFIX:-promobot}_worker
      restart: unless-stopped
      command: python -m app.workers.tasks
      env_file:
        - ${ENV_FILE:-.env}
      environment:
        - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-promobot}:${POSTGRES_PASSWORD_ENC}@postgres:5432/${POSTGRES_DB:-promobot}
        - REDIS_URL=redis://redis:6379/0
        - WORKER_MAX_ATTEMPTS=${WORKER_MAX_ATTEMPTS:-3}
        - MERCADOLIVRE_SESSION_FILE=/run/secrets/mel_session
      depends_on:
        - postgres
        - redis
      volumes:
        - media_cache:/app/media_cache
      networks:
        - promonet
      secrets:
        - postgres_password
        - telegram_bot_token
        - telegram_api_hash
        - amazon_tag
        - mercadolivre_tag
        - shopee_app_id
        - shopee_tag
        - mel_session
      deploy:
        placement:
          constraints:
            - node.labels.zone == pessoal
        resources:
          limits:
            cpus: "0.5"
            memory: "512M"
          reservations:
            cpus: "0.1"
            memory: "128M"
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s

  telegram_listener:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${INSTANCE_PREFIX:-promobot}-telegram_listener
    container_name: ${INSTANCE_PREFIX:-promobot}_telegram_listener
    restart: unless-stopped
    command: python -m app.adapters.telegram
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_SOURCE_CHATS=${TELEGRAM_SOURCE_CHATS:-}
    depends_on:
      - redis
    volumes:
      - media_cache:/app/media_cache
      - session_data:/app/sessions
    networks:
      - promonet
    secrets:
      - telegram_bot_token
      - telegram_api_hash
      - telegram_session_string
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.05"
          memory: "64M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  evolution-api:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:latest}
    container_name: ${INSTANCE_PREFIX:-promobot}_evolution-api
    restart: unless-stopped
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-36a7072b2560021cf93a44e9a8628575465cde542bb0561e}
      - CACHE_REDIS_ENABLED=false
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-promobot}:${POSTGRES_PASSWORD_ENC}@postgres:5432/${EVOLUTION_DB:-evolution_db}?schema=evolution_api
      - DATABASE_PROVIDER=postgresql
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - SERVER_URL=http://evolution-api:8080
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - promonet
    deploy:
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "128M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - api
    networks:
      - promonet
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.zone == pessoal
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          cpus: "0.05"
          memory: "32M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  promonet:

volumes:
  postgres_data:
  redis_data:
  media_cache:
  session_data:
  evolution_instances:

secrets:
  postgres_password:
    external: true
    name: "${INSTANCE_PREFIX}postgres_password"
  telegram_bot_token:
    external: true
    name: "${INSTANCE_PREFIX}telegram_bot_token"
  telegram_api_hash:
    external: true
    name: "${INSTANCE_PREFIX}telegram_api_hash"
  telegram_session_string:
    external: true
    name: "${INSTANCE_PREFIX}telegram_session_string"
  amazon_tag:
    external: true
    name: "${INSTANCE_PREFIX}amazon_tag"
  mercadolivre_tag:
    external: true
    name: "${INSTANCE_PREFIX}mercadolivre_tag"
  shopee_app_id:
    external: true
    name: "${INSTANCE_PREFIX}shopee_app_id"
  shopee_tag:
    external: true
    name: "${INSTANCE_PREFIX}shopee_tag"
  mel_session:
    external: true
    name: "mel_session"